<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Redirecting Case Study | Nathaniel Rodriguez</title>
  <script>
    const params = window.location.search || '';
    window.location.replace('case-study.html' + params);
  </script>
</head>
<body>
  <p>Redirecting to the updated case study template...</p>
  <p><a id="redirect-link" href="case-study.html">Continue to case study</a></p>
  <script>
    document.getElementById('redirect-link').href = 'case-study.html' + (window.location.search || '');
  </script>
</body>
</html>
